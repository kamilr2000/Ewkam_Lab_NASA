[project]
name = "terra-analog"
version = "0.1.0"
description = "Data pipeline and API for the Terra Analog project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.7",
    "numpy==2.5.4",
    "pyproj==3.8.0",
    "rasterio==1.5.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["apps/api/tests", "pipeline/tests"]
